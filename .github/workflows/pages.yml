name: Deploy landing (GitHub Pages)

# Publica la landing page (carpeta site/) en GitHub Pages.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensamblar sitio con las capturas
        run: |
          mkdir -p site/screenshots
          cp docs/screenshots/*.png site/screenshots/

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
